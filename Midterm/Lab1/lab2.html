<!DOCTYPE html>
<html>
<head><title>Internship Confirmation Form</title>
</head>
<body>

<center>
<h1>Internship Confirmation Form</h1>
</center>

<form>

Student Name:<br>
<input type="text" name="sname" required><br><br>

Email Address:<br>
<input type="email" name="email" 
required><br><br>
Preferred Internship Type:<br>

<input type="radio" name="internship"> On-Site<br>
<input type="radio" name="internship"> Remote<br><br>

Internship Duration:<br>

<select>
<option>6 Weeks</option>
<option>3 Months</option>
</select>

<br><br>

Skills of Interest:<br>


<input type="checkbox"> Web Development<br>
<input type="checkbox"> Data Analysis<br>
<input type="checkbox"> Mobile Apps<br><br>
<input type="submit" value="Submit">

</form>

</body>
</html>
